name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /pindu/ # GitHub Pages 子路径部署
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Pages 部署在根路径（BASE_PATH 默认 /），需独立构建
  build-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # wasm 超 Pages 单文件 25MiB 限制：gzip 压缩 + _headers 声明 Content-Encoding
      - run: |
          gzip -k -9 dist/ort-wasm/ort-wasm-simd-threaded.jsep.wasm
          mv dist/ort-wasm/ort-wasm-simd-threaded.jsep.wasm.gz dist/ort-wasm/ort-wasm-simd-threaded.jsep.wasm
          rm -f dist/assets/ort-wasm-simd-threaded.jsep-*.wasm
          printf '/ort-wasm/ort-wasm-simd-threaded.jsep.wasm\n  Content-Encoding: gzip\n  Content-Type: application/wasm\n' > dist/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dist
          path: dist

  deploy-cloudflare:
    needs: build-cloudflare
    runs-on: ubuntu-latest
    if: ${{ secrets.CF_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name pindu --branch main
