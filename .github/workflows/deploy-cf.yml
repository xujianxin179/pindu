name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # CPU wasm 13.5MB < 25MiB 单文件限制，直接上传原始文件。
      # 注意：不能 gzip 压缩 + Content-Encoding 声明——部分安卓 WebView 不自动
      # 解压 wasm 请求的 gzip，WebAssembly.instantiate 会收到压缩数据报
      # "expected magic word 00 61 73 6d, found 1f 8b"（1f 8b = gzip 头）。
      - run: |
          rm -f dist/assets/ort-wasm-simd-threaded.jsep-*.wasm dist/assets/ort-wasm-simd-threaded-*.wasm
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name pindu --branch main
