name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # CPU wasm 13.5MB < 25MiB 单文件限制，直接上传原始文件（不 gzip！）。
      # 安卓 WebView 不解压 wasm 请求的 gzip，会报 "expected magic word ... found 1f 8b"。
      # v2 子目录绕过旧 PWA ai-assets 缓存（CacheFirst 缓存过旧 URL 的 gzip 数据）。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name pindu --branch main
