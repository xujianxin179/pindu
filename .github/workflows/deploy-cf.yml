name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # wasm 超 Pages 单文件 25MiB 限制：gzip 压缩 + _headers 声明 Content-Encoding
      - run: |
          gzip -k -9 dist/ort-wasm/ort-wasm-simd-threaded.jsep.wasm
          mv dist/ort-wasm/ort-wasm-simd-threaded.jsep.wasm.gz dist/ort-wasm/ort-wasm-simd-threaded.jsep.wasm
          rm -f dist/assets/ort-wasm-simd-threaded.jsep-*.wasm
          printf '/ort-wasm/ort-wasm-simd-threaded.jsep.wasm\n  Content-Encoding: gzip\n  Content-Type: application/wasm\n' > dist/_headers
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name pindu --branch main
